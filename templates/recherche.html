<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='recherche.css') }}">
</head>
<body>
<button class="nav-toggle" id="navToggle" aria-label="Menu">
    <span></span><span></span><span></span>
</button>
<div class="nav-overlay" id="navOverlay"></div>
<header>
    <nav>
        <a href="{{ url_for('profil') }}">👤 Mon profil</a>
		<a href="{{ url_for('feed_global') }}">🌍 Fil Global</a>
        <a href="{{ url_for('feed_abonnement') }}">📰 Fil d'abonnement</a>
		<a href="{{ url_for('posts_likes') }}">❤️ Post Liker</a>
        <a href="{{ url_for('messagerie') }}">📩 Messages</a>
		<a href="{{ url_for('recherche') }}">🔎 Recherche</a>
        <a href="{{ url_for('notifications') }}">🔔 Notifs</a>
        <a href="{{ url_for('leaderboard') }}">🏆 Classement</a>
        <a href="{{ url_for('carte') }}">🗺️ Carte</a>
        <a href="{{ url_for('deconnexion') }}">Déconnexion</a>
		<button id="themeToggle">🌙</button>
    </nav>
</header>
<main>
<h2>🔎 Recherche</h2>

<form method="GET" action="{{ url_for('recherche') }}" class="search-box">
    <input type="text" name="q" placeholder="Rechercher un utilisateur..." value="{{ query }}">
    <button type="submit">Rechercher</button>
</form>

{% if users %}
    {% for u in users %}
        <div class="user">
            <img src="{{ url_for('static', filename='avatars/' ~ (u.avatar_url or 'default.png')) }}">
            
            <a href="{{ url_for('profil_public', user_id=u.id) }}">
                {{ u.username }}
            </a>
        </div>
    {% endfor %}
{% elif query %}
    <p>Aucun utilisateur trouvé.</p>
{% endif %}

</main>

<script>
const toggle = document.getElementById("themeToggle");

if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark");
    if(toggle) toggle.textContent = "☀️";
}

if(toggle){
    toggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");

        if(document.body.classList.contains("dark")){
            localStorage.setItem("theme", "dark");
            toggle.textContent = "☀️";
        } else {
            localStorage.setItem("theme", "light");
            toggle.textContent = "🌙";
        }
    });
}
</script>
</body>
</html>
