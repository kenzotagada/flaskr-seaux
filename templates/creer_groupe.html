<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un groupe</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='creer_groupe.css') }}">
</head>
<body>
<button class="nav-toggle" id="navToggle" aria-label="Menu">
    <span></span><span></span><span></span>
</button>
<div class="nav-overlay" id="navOverlay"></div>
<header>
    <nav>
        <a href="{{ url_for('profil') }}">👤 Mon profil</a>
		<a href="{{ url_for('feed_global') }}">🌍 Fil Global</a>
        <a href="{{ url_for('feed_abonnement') }}">📰 Fil d'abonnement</a>
		<a href="{{ url_for('posts_likes') }}">❤️ Post Liker</a>
        <a href="{{ url_for('messagerie') }}">📩 Messages</a>
		<a href="{{ url_for('recherche') }}">🔎 Recherche</a>
        <a href="{{ url_for('notifications') }}">🔔 Notifs</a>
        <a href="{{ url_for('leaderboard') }}">🏆 Classement</a>
        <a href="{{ url_for('carte') }}">🗺️ Carte</a>
        <a href="{{ url_for('deconnexion') }}">Déconnexion</a>
		<button id="themeToggle">🌙</button>
    </nav>
</header>
<main>
<form method="POST">
        <input type="text" name="name" placeholder="Nom du groupe" required>
        <button type="submit">Créer</button>
    </form>
</main>
<script>
(function(){
    const btn = document.getElementById('navToggle');
    const header = document.querySelector('header');
    const overlay = document.getElementById('navOverlay');
    if(!btn) return;
    function toggle(open){
        btn.classList.toggle('open', open);
        header.classList.toggle('open', open);
        overlay.classList.toggle('visible', open);
    }
    btn.addEventListener('click', function(){ toggle(!header.classList.contains('open')); });
    overlay.addEventListener('click', function(){ toggle(false); });
    document.querySelectorAll('header nav a').forEach(function(a){
        a.addEventListener('click', function(){ toggle(false); });
    });
})();
</script>
</body>
</html>
