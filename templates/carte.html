<main>
<h2>Ma carte</h2>

<button onclick="activerLocalisation()">Activer ma position</button>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    var map = L.map('map').setView([0, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var myMarker = null;
    var otherMarkers = {};

    function envoyerPosition(lat, lon) {
        fetch('/update_position', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `lat=${lat}&lon=${lon}`
        });
    }

    function chargerUtilisateurs() {
        fetch('/api/user_positions')
            .then(res => res.json())
            .then(data => {

                for (let id in otherMarkers) {
                    map.removeLayer(otherMarkers[id]);
                }
                otherMarkers = {};

                data.forEach(user => {
                    if (myMarker) {
                        const myPos = myMarker.getLatLng();
                        if (Math.abs(user.lat - myPos.lat) < 0.00001 &&
                            Math.abs(user.lon - myPos.lng) < 0.00001) {
                            return;
                        }
                    }

                    var m = L.marker([user.lat, user.lon]).addTo(map)
                        .bindPopup(user.username);

                    otherMarkers[user.id] = m;
                });
            });
    }

    function activerLocalisation() {
        if (!navigator.geolocation) {
            alert("Géolocalisation non supportée");
            return;
        }

        navigator.geolocation.watchPosition(
            function(position) {
                var lat = position.coords.latitude;
                var lon = position.coords.longitude;

                map.setView([lat, lon], 13);

                if (!myMarker) {
                    myMarker = L.marker([lat, lon]).addTo(map)
                        .bindPopup("Vous êtes ici")
                        .openPopup();
                } else {
                    myMarker.setLatLng([lat, lon]);
                }

                envoyerPosition(lat, lon);
            },
            function(error) {
                alert("Autorisation refusée ou erreur GPS");
                console.warn("Erreur GPS :", error.message);
            }
        );
    }
	
    setInterval(chargerUtilisateurs, 5000);

</script>

</main>
<script>
(function(){
    const btn = document.getElementById('navToggle');
    const header = document.querySelector('header');
    const overlay = document.getElementById('navOverlay');
    if(!btn) return;
    function toggle(open){
        btn.classList.toggle('open', open);
        header.classList.toggle('open', open);
        overlay.classList.toggle('visible', open);
    }
    btn.addEventListener('click', function(){ toggle(!header.classList.contains('open')); });
    overlay.addEventListener('click', function(){ toggle(false); });
    document.querySelectorAll('header nav a').forEach(function(a){
        a.addEventListener('click', function(){ toggle(false); });
    });
})();
</script>

<script>
const toggle = document.getElementById("themeToggle");

if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark");
    if(toggle) toggle.textContent = "☀️";
}

if(toggle){
    toggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");

        if(document.body.classList.contains("dark")){
            localStorage.setItem("theme", "dark");
            toggle.textContent = "☀️";
        } else {
            localStorage.setItem("theme", "light");
            toggle.textContent = "🌙";
        }
    });
}
</script>
